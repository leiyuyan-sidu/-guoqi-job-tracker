<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国央企校招信息看板</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <a href="." class="navbar-brand d-flex align-items-center gap-2 pe-0 pe-md-3">
        <img src="favicon.svg" width="28" height="28" alt="">
        国央企校招信息看板
      </a>
      <div class="navbar-nav flex-row order-md-last align-items-center gap-3">
        <span class="text-secondary small d-none d-md-inline" id="updated-hint"></span>
        <div class="nav-item" id="auth-bar"></div>
      </div>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col">
            <div class="page-pretitle">2027 届 · 国际商务硕士</div>
            <h2 class="page-title">岗位总览</h2>
          </div>
          <div class="col-auto ms-auto">
            <button type="button" class="btn btn-outline-secondary hidden" id="batch-toggle"><i class="ti ti-checkbox"></i>批量标记</button>
          </div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="container-xl">

        <div class="row row-deck row-cards mb-3">
          <div class="col-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="d-flex align-items-center">
                  <div class="subheader">可报名岗位</div>
                  <div class="ms-auto lh-1"><span class="badge bg-green-lt hidden" id="stat-new"></span></div>
                </div>
                <div class="h1 mb-1 mt-1" id="stat-total">—</div>
                <div class="text-secondary small" id="stat-total-sub">&nbsp;</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="d-flex align-items-center">
                  <div class="subheader">待处理</div>
                  <div class="ms-auto lh-1 text-secondary small" id="stat-pending-ratio"></div>
                </div>
                <div class="h1 mb-1 mt-1" id="stat-pending">—</div>
                <div class="text-secondary small mb-2" id="stat-pending-sub">&nbsp;</div>
                <div class="progress progress-sm"><div class="progress-bar bg-primary" id="stat-pending-bar" style="width: 0%"></div></div>
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="d-flex align-items-center">
                  <div class="subheader">已投递</div>
                  <div class="ms-auto lh-1"><i class="ti ti-send text-secondary"></i></div>
                </div>
                <div class="h1 mb-1 mt-1" id="stat-applied">—</div>
                <div class="text-secondary small" id="stat-applied-sub">&nbsp;</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="d-flex align-items-center">
                  <div class="subheader">两周内截止</div>
                  <div class="ms-auto lh-1"><i class="ti ti-alarm text-red"></i></div>
                </div>
                <div class="h1 mb-1 mt-1" id="stat-urgent">—</div>
                <div class="text-secondary small" id="stat-urgent-sub">&nbsp;</div>
              </div>
            </div>
          </div>
        </div>

        <div class="row row-cards">
          <div class="col-lg-3">
            <div class="card mb-3">
              <div class="card-header"><h3 class="card-title" id="bucket-title">截止时间</h3></div>
              <div class="list-group list-group-flush" id="bucket-chips"></div>
            </div>

            <div class="card hidden" id="upcoming-card">
              <div class="card-header">
                <h3 class="card-title">即将到来</h3>
                <div class="card-actions text-secondary small">7 天内</div>
              </div>
              <div class="list-group list-group-flush" id="upcoming-list"></div>
            </div>
          </div>

          <div class="col-lg-9">
            <div class="card" id="list-card">
              <div class="card-header">
                <ul class="nav nav-tabs card-header-tabs">
                  <li class="nav-item"><a href="#" class="nav-link active" id="tab-pending" data-tab="pending">待处理<span class="badge bg-primary-lt ms-2" id="tab-pending-count"></span></a></li>
                  <li class="nav-item"><a href="#" class="nav-link" id="tab-progress" data-tab="progress">投递进度<span class="badge ms-2" id="tab-progress-count"></span></a></li>
                  <li class="nav-item"><a href="#" class="nav-link" id="tab-resolved" data-tab="resolved">已处理记录<span class="badge ms-2" id="tab-resolved-count"></span></a></li>
                </ul>
              </div>
              <div class="card-body border-bottom py-3">
                <div class="d-flex flex-wrap gap-2">
                  <div class="input-icon flex-fill" style="min-width: 220px">
                    <span class="input-icon-addon"><i class="ti ti-search"></i></span>
                    <input type="text" class="form-control" id="filter-search" placeholder="搜索单位或岗位名称">
                  </div>
                  <select class="form-select w-auto" id="filter-source"><option value="">全部来源</option></select>
                  <input type="date" class="form-control w-auto" id="filter-date" title="按入库日期（已处理页签按处理日期）筛选">
                </div>
              </div>
              <div id="job-list"></div>
              <div class="card-footer d-flex flex-wrap gap-2 align-items-center hidden" id="list-footer">
                <p class="m-0 text-secondary small" id="list-summary"></p>
                <ul class="pagination m-0 ms-auto" id="pagination"></ul>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <footer class="footer footer-transparent d-print-none">
      <div class="container-xl text-secondary small">数据来自国聘、国务院国资委、中国进出口银行 · 每日 06:00 自动更新</div>
    </footer>
  </div>
</div>

<div class="batch-bar hidden" id="batch-bar">
  <div class="card shadow-lg">
    <div class="card-body py-2 d-flex flex-wrap align-items-center gap-2">
      <strong id="batch-count">已选 0 条</strong>
      <button type="button" class="btn btn-link btn-sm" id="batch-select-page">全选本页</button>
      <button type="button" class="btn btn-link btn-sm" id="batch-select-all">全选筛选结果</button>
      <div class="ms-auto d-flex gap-2">
        <button type="button" class="btn btn-sm btn-outline-warning batch-action" id="batch-undecided"><i class="ti ti-help-circle"></i>待定</button>
        <button type="button" class="btn btn-sm btn-danger batch-action" id="batch-skip"><i class="ti ti-x"></i>不投递</button>
        <button type="button" class="btn btn-sm btn-ghost-secondary" id="batch-cancel">退出</button>
      </div>
    </div>
  </div>
</div>

<div class="undo-toast hidden" id="undo-toast">
  <div class="toast show" role="status">
    <div class="toast-body d-flex align-items-center gap-3">
      <span id="undo-text"></span>
      <button type="button" class="btn btn-sm btn-primary ms-auto" id="undo-btn">撤销</button>
    </div>
  </div>
</div>

<dialog id="login-dialog" class="tb-dialog">
  <form id="login-form" class="modal-content">
    <div class="modal-header"><h5 class="modal-title">登录</h5></div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label" for="login-email">邮箱</label>
        <input type="email" class="form-control" id="login-email" required>
      </div>
      <div class="mb-2">
        <label class="form-label" for="login-password">密码</label>
        <input type="password" class="form-control" id="login-password" required>
      </div>
      <div class="text-danger small" id="login-error"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link link-secondary" id="login-cancel">取消</button>
      <button type="submit" class="btn btn-primary ms-auto">登录</button>
    </div>
  </form>
</dialog>

<dialog id="undecided-dialog" class="tb-dialog">
  <form id="undecided-form" class="modal-content">
    <div class="modal-header"><h5 class="modal-title">标记待定</h5></div>
    <div class="modal-body">
      <div class="form-label">原因</div>
      <div class="form-selectgroup form-selectgroup-pills">
        <label class="form-selectgroup-item"><input type="radio" name="undecided-reason" value="工资一般" class="form-selectgroup-input"><span class="form-selectgroup-label">工资一般</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="undecided-reason" value="地区一般" class="form-selectgroup-input"><span class="form-selectgroup-label">地区一般</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="undecided-reason" value="专业不太符合" class="form-selectgroup-input"><span class="form-selectgroup-label">专业不太符合</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="undecided-reason" value="其他" class="form-selectgroup-input"><span class="form-selectgroup-label">其他</span></label>
      </div>
      <textarea id="undecided-other-reason" class="form-control mt-3 hidden" rows="2" placeholder="请填写具体原因"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link link-secondary" id="undecided-cancel">取消</button>
      <button type="submit" class="btn btn-warning ms-auto">确认待定</button>
    </div>
  </form>
</dialog>

<dialog id="skip-dialog" class="tb-dialog">
  <form id="skip-form" class="modal-content">
    <div class="modal-header"><h5 class="modal-title">标记不投递</h5></div>
    <div class="modal-body">
      <div class="form-label">原因</div>
      <div class="form-selectgroup form-selectgroup-pills">
        <label class="form-selectgroup-item"><input type="radio" name="skip-reason" value="工资太低" class="form-selectgroup-input"><span class="form-selectgroup-label">工资太低</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="skip-reason" value="地区不合适" class="form-selectgroup-input"><span class="form-selectgroup-label">地区不合适</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="skip-reason" value="工作内容不喜欢" class="form-selectgroup-input"><span class="form-selectgroup-label">工作内容不喜欢</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="skip-reason" value="专业不符合" class="form-selectgroup-input"><span class="form-selectgroup-label">专业不符合</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="skip-reason" value="其他" class="form-selectgroup-input"><span class="form-selectgroup-label">其他</span></label>
      </div>
      <textarea id="skip-other-reason" class="form-control mt-3 hidden" rows="2" placeholder="请填写具体原因"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link link-secondary" id="skip-cancel">取消</button>
      <button type="submit" class="btn btn-danger ms-auto">确认不投递</button>
    </div>
  </form>
</dialog>

<dialog id="progress-dialog" class="tb-dialog">
  <form id="progress-form" class="modal-content">
    <div class="modal-header">
      <div>
        <h5 class="modal-title">记录进展</h5>
        <div class="text-secondary small mt-1" id="progress-subject"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="form-label">阶段</div>
      <div class="form-selectgroup form-selectgroup-pills mb-3">
        <label class="form-selectgroup-item"><input type="radio" name="progress-stage" value="applied" class="form-selectgroup-input"><span class="form-selectgroup-label">已投递</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="progress-stage" value="resume_passed" class="form-selectgroup-input"><span class="form-selectgroup-label">简历通过</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="progress-stage" value="written_test" class="form-selectgroup-input"><span class="form-selectgroup-label">笔试</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="progress-stage" value="interview" class="form-selectgroup-input"><span class="form-selectgroup-label">面试</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="progress-stage" value="offer" class="form-selectgroup-input"><span class="form-selectgroup-label">Offer</span></label>
        <label class="form-selectgroup-item"><input type="radio" name="progress-stage" value="rejected" class="form-selectgroup-input"><span class="form-selectgroup-label">未通过</span></label>
      </div>
      <div class="row g-2">
        <div class="col-sm-6">
          <label class="form-label" for="progress-date">日期</label>
          <input type="date" class="form-control" id="progress-date" required>
          <div class="form-hint">可填未来日期，用于笔试 / 面试排期</div>
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="progress-note">备注</label>
          <input type="text" class="form-control" id="progress-note" maxlength="60" placeholder="如「二面」「线上机考」">
        </div>
      </div>
      <div class="text-danger small mt-2" id="progress-error"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link link-secondary" id="progress-cancel">取消</button>
      <button type="submit" class="btn btn-primary ms-auto">保存</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
