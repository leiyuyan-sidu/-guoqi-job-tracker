<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国央企校招信息看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background-art" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
    <defs>
      <pattern id="paper-fibers" width="180" height="120" patternUnits="userSpaceOnUse">
        <path class="fiber-blue" d="M12 18l17-3M61 9l9 2M112 24l22-5M154 15l11 1M34 54l12-4M86 43l19 3M142 62l25-2M7 91l14 2M53 104l24-6M104 86l11 3M148 110l18-5" />
        <path class="fiber-white" d="M25 34l8 4M74 27l15-6M126 43l8 5M163 39l10-3M17 72l18-1M66 69l10 5M112 67l16-4M158 84l14 3M37 115l10-5M91 108l17 2M132 98l9-4" />
      </pattern>
    </defs>
    <rect class="paper-fiber-layer" width="1440" height="900" fill="url(#paper-fibers)" />
    <path class="flight-path" d="M-70 790 C120 735 55 590 180 520 C335 432 292 280 455 218 C650 143 827 250 995 157 C1140 77 1265 122 1510 18" />
    <circle class="flight-node node-one" cx="180" cy="520" r="4" />
    <circle class="flight-node node-two" cx="995" cy="157" r="4" />
  </svg>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand-block">
      <span class="brand-plane" aria-hidden="true">
        <svg class="paper-plane-svg" viewBox="0 0 40 28"><path class="paper-under" d="M3 14 38 3 27 26 19 18 12 23 13.5 16Z"/><path class="paper-face" d="M2 12 37 2 25 24 18 16 10 21 12 14Z"/><path class="paper-fold" d="M12 14 37 2 18 16M18 16 25 24"/></svg>
      </span>
      <div class="brand-copy">
        <h1><span>国央企校招</span><span class="brand-accent">信息看板</span></h1>
        <p class="brand-subtitle">为2027届国际商务硕士筛选可投递岗位</p>
        <p class="updated-hint" id="updated-hint"></p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="num" id="stat-total">—</div>
        <div class="label">可报名岗位</div>
      </div>
      <div class="stat-card muted">
        <div class="num" id="stat-applied">—</div>
        <div class="label">已投递</div>
      </div>
    </div>
  </header>

  <div class="auth-bar" id="auth-bar"></div>

  <div class="sticky-toolbar">
  <div class="tabs">
    <button class="tab-btn active" id="tab-pending" data-tab="pending">待处理 <span id="tab-pending-count"></span></button>
    <button class="tab-btn" id="tab-resolved" data-tab="resolved">已处理记录 <span id="tab-resolved-count"></span></button>
  </div>

  <div class="filters">
    <select id="filter-source"><option value="">全部来源</option></select>
    <input type="date" id="filter-date" title="按处理/新增日期筛选">
    <input type="text" id="filter-search" placeholder="搜索公司或岗位名称">
  </div>

  <div class="chip-row" id="bucket-chips"></div>
  </div>

  <div class="job-list" id="job-list">
    <div class="loading-heading">
      <span class="loading-flight" aria-hidden="true">
        <svg class="paper-plane-svg" viewBox="0 0 40 28"><path class="paper-under" d="M3 14 38 3 27 26 19 18 12 23 13.5 16Z"/><path class="paper-face" d="M2 12 37 2 25 24 18 16 10 21 12 14Z"/><path class="paper-fold" d="M12 14 37 2 18 16M18 16 25 24"/></svg>
      </span>
      正在加载最新岗位信息…
    </div>
    <div class="skeleton-card" aria-hidden="true"><i class="skeleton-line title"></i><i class="skeleton-line medium"></i><i class="skeleton-line long"></i><i class="skeleton-line footer"></i></div>
    <div class="skeleton-card" aria-hidden="true"><i class="skeleton-line title short"></i><i class="skeleton-line medium"></i><i class="skeleton-line long"></i><i class="skeleton-line footer"></i></div>
    <div class="skeleton-card" aria-hidden="true"><i class="skeleton-line title"></i><i class="skeleton-line medium short"></i><i class="skeleton-line long"></i><i class="skeleton-line footer"></i></div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<dialog id="login-dialog">
  <h3>登录</h3>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="邮箱" required>
    <input type="password" id="login-password" placeholder="密码" required>
    <p class="dialog-error" id="login-error"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="login-cancel">取消</button>
      <button type="submit" class="primary">登录</button>
    </div>
  </form>
</dialog>

<dialog id="undecided-dialog">
  <h3>标记待定</h3>
  <form id="undecided-form">
    <div class="radio-group">
      <label><input type="radio" name="undecided-reason" value="工资一般"> 工资一般</label>
      <label><input type="radio" name="undecided-reason" value="地区一般"> 地区一般</label>
      <label><input type="radio" name="undecided-reason" value="专业不太符合"> 专业不太符合</label>
      <label><input type="radio" name="undecided-reason" value="其他"> 其他</label>
    </div>
    <textarea id="undecided-other-reason" rows="2" placeholder="请填写具体原因" class="hidden"></textarea>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="undecided-cancel">取消</button>
      <button type="submit" class="primary">确认</button>
    </div>
  </form>
</dialog>

<dialog id="skip-dialog">
  <h3>标记不投递</h3>
  <form id="skip-form">
    <div class="radio-group">
      <label><input type="radio" name="skip-reason" value="工资太低"> 工资太低</label>
      <label><input type="radio" name="skip-reason" value="地区不合适"> 地区不合适</label>
      <label><input type="radio" name="skip-reason" value="工作内容不喜欢"> 工作内容不喜欢</label>
      <label><input type="radio" name="skip-reason" value="专业不符合"> 专业不符合</label>
      <label><input type="radio" name="skip-reason" value="其他"> 其他</label>
    </div>
    <textarea id="skip-other-reason" rows="2" placeholder="请填写具体原因" class="hidden"></textarea>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="skip-cancel">取消</button>
      <button type="submit" class="primary">确认</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
